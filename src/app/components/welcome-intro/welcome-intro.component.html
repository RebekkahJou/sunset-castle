<section id="welcome" class="section section--cream">
  <div class="section-inner intro">
    <div class="intro__text">
      <h2>What a Beautiful Place to Live</h2>
      <p>{{ welcomeIntroText }}</p>
      <p class="intro__address">{{ houseAddress }}</p>
    </div>
    <div class="intro__photo">
      <img
        appImageSkeleton
        [src]="'photos/' + welcomeIntroImageFileName"
        [alt]="welcomeIntroImageAltText"
      />
    </div>
  </div>
</section>
