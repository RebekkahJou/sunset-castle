<section id="welcome" class="section section--cream">
  <div class="section-inner">
    <div class="intro">
      <div class="intro__details">
        <h2>What a Beautiful Place to Live</h2>
        <p>{{ welcomeIntroText }}</p>
        <p class="intro__address">{{ houseAddress }}</p>
      </div>
      <div class="intro__photo">
        <img
          appImageSkeleton
          [src]="welcomeIntroImageSrc"
          [srcset]="welcomeIntroImageSrcset"
          sizes="(max-width: 860px) 90vw, 500px"
          [alt]="welcomeIntroImageAltText"
        />
      </div>
      <div class="intro__actions">
        <div class="intro__cta-row">
          <a
            class="intro__cta-button"
            [href]="listingDetails.listingUrl"
            target="_blank"
            rel="noopener"
            >View the Full Listing</a
          >
          <a
            class="intro__cta-button"
            [href]="listingDetails.videoTourUrl"
            target="_blank"
            rel="noopener"
            >Watch the Video Tour</a
          >
        </div>
        <p class="intro__cta-note">
          Listed by {{ listingDetails.agentName }}, {{ listingDetails.agentBrokerage }} &middot;
          {{ listingDetails.agentPhone }}
        </p>
      </div>
    </div>
    <a
      class="scroll-cue"
      href="#nj-flowers"
      aria-label="Scroll down to see more of the home and neighborhood"
    >
      <span class="scroll-cue__label">Keep exploring</span>
      <span class="scroll-cue__chevron" aria-hidden="true"></span>
    </a>
  </div>
</section>
