<section
  [id]="section().id"
  class="section"
  [class]="'section--' + section().background"
  [class.section--dotted]="section().dotted"
>
  <div class="section-inner">
    <div class="section__heading">
      <h2>{{ section().heading }}</h2>
      @if (section().intro) {
        <p>{{ section().intro }}</p>
      }
    </div>
    @if (section().focalPhoto; as focalPhoto) {
      <figure class="collage__focal">
        <button
          type="button"
          class="collage__photo-button"
          [attr.aria-label]="'Enlarge photo: ' + focalPhoto.caption"
          (click)="openLightbox($event, photoPath(focalPhoto.fileName), focalPhoto.altText)"
        >
          <img
            [src]="photoPath(focalPhoto.fileName)"
            [alt]="focalPhoto.altText"
            (error)="onImageLoadError($event, focalPhoto.fallbackLabel)"
          />
        </button>
        <figcaption class="collage__caption">{{ focalPhoto.caption }}</figcaption>
      </figure>
    }
    <div class="collage">
      @for (photo of section().photos; track photo.fileName) {
        <figure class="collage__item">
          <button
            type="button"
            class="collage__photo-button"
            [attr.aria-label]="'Enlarge photo: ' + photo.caption"
            (click)="openLightbox($event, photoPath(photo.fileName), photo.altText)"
          >
            <img
              [src]="photoPath(photo.fileName)"
              [alt]="photo.altText"
              (error)="onImageLoadError($event, photo.fallbackLabel)"
            />
          </button>
          <figcaption class="collage__caption">{{ photo.caption }}</figcaption>
        </figure>
      }
    </div>
  </div>
</section>
