<nav class="site-nav">
  <div class="site-nav__inner">
    <a href="#top" class="site-nav__brand" (click)="navigateToSection($event, 'top')"
      >Sunset Castle</a
    >
    <button
      class="site-nav__toggle"
      type="button"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMobileMenu()"
    >
      Menu
    </button>
    <ul class="site-nav__links" [class.is-open]="isMobileMenuOpen()">
      @for (link of navLinks; track link.id) {
        <li>
          <a [href]="'#' + link.id" (click)="navigateToSection($event, link.id)">{{
            link.label
          }}</a>
        </li>
      }
    </ul>
  </div>
</nav>
